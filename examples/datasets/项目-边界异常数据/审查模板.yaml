# 审查模板种子数据。definition 为工作流 YAML 文本（GitHub Actions 语法子集：jobs/uses/needs/with）；
# project_code 为 null 表示全局模板；runs 为 seed 预执行的运行绑定（project_code + iteration_number + workflow_code）。
# 本数据集覆盖异常边界：规则检查存在 error 级发现项（4 error / 2 warning / 1 info）；
# 三个仿真作业与规则检查并行执行（不经 needs 门禁，保证预期 verdict 均可产出）：
# 轻载 pass / 额定单指标超阈 fail / 超载全指标超阈 fail，流水线结论 failure。
templates:
  - code: TRL-REVIEW
    name: 托辊边界审查流水线
    project_code: TRL-2026
    description: 静态规则检查（托辊边界检查集）与三档载荷辊筒轴校核并行执行；规则检查存在 error 级发现项，轻载校核通过、额定与超载校核超阈
    definition: |
      name: 托辊边界审查
      description: 静态规则检查与三档载荷校核并行执行

      jobs:
        rules-check:
          name: 静态规则检查
          uses: rules/check
          with:
            rule_set: 托辊边界检查集
        light-sim:
          name: 辊筒轴轻载校核
          uses: simulation/run
          with:
            template: TRL-LIGHT-CHECK
            artifact: RLL-101
        nominal-sim:
          name: 辊筒轴额定校核
          uses: simulation/run
          with:
            template: TRL-NOMINAL-CHECK
            artifact: RLL-101
        overload-sim:
          name: 辊筒轴超载校核
          uses: simulation/run
          with:
            template: TRL-OVERLOAD-CHECK
            artifact: RLL-101
runs:
  - project_code: TRL-2026
    iteration_number: 1
    workflow_code: TRL-REVIEW

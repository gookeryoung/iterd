# 审查模板种子数据。definition 为工作流 YAML 文本（GitHub Actions 语法子集：jobs/uses/needs/with）；
# project_code 为 null 表示全局模板；runs 为 seed 预执行的运行绑定（project_code + iteration_number + workflow_code）。
# 本数据集演示门禁语义：规则检查存在 error 级发现项（DRAFT-001 / MATL-001）→ rules-check 判 failure，
# 下游横梁仿真被跳过（skipped），整条流水线结论 failure（对齐 GitHub Actions 的 needs 门禁与跳过展示）。
templates:
  - code: FRAME-REVIEW
    name: 机架设计审查流水线
    project_code: CVY-2026
    description: 静态规则检查（机械设计通用规范）通过后执行横梁静强度仿真；当前设计存在 error 级发现项，仿真环节将被门禁跳过
    definition: |
      name: 机架设计审查
      description: 静态规则检查通过后执行横梁静强度仿真

      jobs:
        rules-check:
          name: 静态规则检查
          uses: rules/check
          with:
            rule_set: 机械设计通用规范
        beam-sim:
          name: 横梁静强度仿真
          needs: rules-check
          uses: simulation/run
          with:
            template: BEAM-STATIC-CHECK
            artifact: DRW-002
runs:
  - project_code: CVY-2026
    iteration_number: 2
    workflow_code: FRAME-REVIEW

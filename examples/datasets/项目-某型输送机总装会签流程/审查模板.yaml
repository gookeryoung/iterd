# 审查模板种子数据。definition 为工作流 YAML 文本（GitHub Actions 语法子集：jobs/uses/needs/with）；
# runs 为 seed 预执行的运行绑定（project_code + iteration_number + workflow_code）。
# 本数据集演示流水线内审批会签：静态检查全绿 → sign-off（approval/request）挂起等待人工签署
# （运行置 waiting，出现在待办中心）→ 会签达成（min_count=1）后自动续跑下游纵梁静强度仿真。
# approvers 中 reviewer 为演示账号（项目 reviewer 角色，用户名命中）；admin 为超管恒在审批范围。
templates:
  - code: ASM-SIGNOFF
    name: 总装会签流水线
    project_code: CVZ-2026
    description: 静态规则检查通过后进入会签（reviewer 一人通过即达成）；会签通过后执行纵梁静强度仿真
    definition: |
      name: 总装设计会签
      description: 静态规则检查通过后人工会签，会签达成后执行纵梁静强度仿真

      jobs:
        rules-check:
          name: 静态规则检查
          uses: rules/check
          with:
            rule_set: 总装会签检查集
        sign-off:
          name: 总装会签
          needs: rules-check
          uses: approval/request
          with:
            approvers: [reviewer, admin]
            min_count: 1
        beam-sim:
          name: 纵梁静强度仿真
          needs: sign-off
          uses: simulation/run
          with:
            template: BEAM-ASM-CHECK
            artifact: DRW-101
runs:
  - project_code: CVZ-2026
    iteration_number: 1
    workflow_code: ASM-SIGNOFF

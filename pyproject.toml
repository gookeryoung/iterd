[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies    = ["fastapi>=0.100.0", "uvicorn[standard]>=0.20.0"]
description     = "产品迭代式开发系统."
license         = "MIT"
name            = "iterd"
readme          = "README.md"
requires-python = ">=3.12"
version         = "0.1.0"

[project.optional-dependencies]
dev = [
    "iterd[lint,test]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0",
]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "httpx2>=1.0.0", # starlette TestClient 运行所需
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]
[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/iterd"]

[tool.hatch.build.targets.wheel.force-include]
"src/iterd/py.typed" = "iterd/py.typed"

[[tool.uv.index]]
default = true
url     = "https://mirrors.huaweicloud.com/artifactory/pypi-public/simple/"


[dependency-groups]
dev = ["iterd[dev,docs]"]
